name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build installer
        run: pnpm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniPetSetup
          path: |
            release/MiniPetSetup-*-x64.exe
            release/latest.json
            release/release-manifest-*.json
          if-no-files-found: error

      - name: Publish installer to TOS when secrets are configured
        if: github.event_name == 'workflow_dispatch'
        env:
          VOLCENGINE_ACCESS_KEY_ID: ${{ secrets.VOLCENGINE_ACCESS_KEY_ID }}
          VOLCENGINE_SECRET_ACCESS_KEY: ${{ secrets.VOLCENGINE_SECRET_ACCESS_KEY }}
          VOLCENGINE_TOS_BUCKET: ${{ secrets.VOLCENGINE_TOS_BUCKET }}
          VOLCENGINE_TOS_REGION: ${{ secrets.VOLCENGINE_TOS_REGION }}
          VOLCENGINE_TOS_ENDPOINT: ${{ secrets.VOLCENGINE_TOS_ENDPOINT }}
          MINIPET_DOWNLOAD_ORIGIN: https://download.minipet.versecraft.cn
        shell: pwsh
        run: |
          $required = @(
            "VOLCENGINE_ACCESS_KEY_ID",
            "VOLCENGINE_SECRET_ACCESS_KEY",
            "VOLCENGINE_TOS_BUCKET",
            "VOLCENGINE_TOS_ENDPOINT"
          )
          $missing = $required | Where-Object { -not (Get-Item "Env:$_" -ErrorAction SilentlyContinue).Value }
          if ($missing.Count -gt 0) {
            Write-Host "Skipping TOS publish because required secrets are not configured: $($missing -join ', ')"
            exit 0
          }
          node scripts/upload-release-to-tos.mjs
