appId: cn.versecraft.minipet
productName: MiniPet
directories:
  output: release
files:
  - dist-main/**
  - dist/renderer/**
  - package.json
asar: true
win:
  signAndEditExecutable: false
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  artifactName: MiniPetSetup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: MiniPet
  installerLanguages:
    - zh_CN
extraResources:
  - from: design
    to: design
    filter:
      - "**/*"
