appId: cn.versecraft.minipet
productName: MiniPet
directories:
  output: release
files:
  - dist-main/**
  - dist/renderer/**
  - package.json
asar: true
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  forceCodeSigning: false
  executableName: MiniPet
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
  artifactName: MiniPetSetup-${version}-x64.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: 爪爪
  installerLanguages:
    - zh_CN
extraResources:
  - from: design
    to: design
    filter:
      - "**/*"
  - from: build/icon.png
    to: brand/icon.png
  - from: build/icon.ico
    to: brand/icon.ico
